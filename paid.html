<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment · Banners</title><style>
:root{--bg:#0c0c0e;--fg:#f2f2f4;--muted:#9a9aa2;--accent:#8e2440}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Rounded",system-ui,sans-serif;text-align:center}
main{max-width:420px;padding:32px 20px}
img{width:72px;height:72px;border-radius:16px}
h1{font-size:28px;line-height:1.2;letter-spacing:-.4px;margin:20px 0 8px}
p{color:var(--muted);margin:0 0 28px}
a.btn{display:inline-block;padding:16px 32px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none}
</style></head>
<body><main>
<img src="icon.png" alt="">
<h1 id="title">Payment received</h1>
<p id="body">Your card is on hold and is only charged when your video is approved. Head back to Banners to see your place in line.</p>
<a class="btn" href="banners://paid">Back to Banners</a>
</main>
<script>
if (new URLSearchParams(location.search).has("cancelled")) {
  document.getElementById("title").textContent = "Payment cancelled";
  document.getElementById("body").textContent = "Your card wasn't charged. Head back to Banners to try again.";
}
</script>
</body></html>
